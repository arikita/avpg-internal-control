name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: # cho phép trigger manual từ tab Actions

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Typecheck + deploy --env production
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env production
